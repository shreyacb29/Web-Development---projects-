<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="cal.css">
</head>
<body>

    <div class="container">

        <h1>Calculator</h1>

        <p>Enter any two numbers:</p>

        <label for="a">Input a:</label>
        <input type="number" id="a">

        <label for="b">Input b:</label>
        <input type="number" id="b">

        <button id="addBtn">Addition</button>

        <button id="subBtn">Subtraction</button>

        <button id="mulBtn">Multiplication</button>

        <button id="divBtn">Division</button>

        <br><br>

        <label>Addition:</label>
        <span id="addResult"></span>
        <br><br>

        <label>Subtraction:</label>
        <span id="subResult"></span>
        <br><br>

        <label>Multiplication:</label>
        <span id="mulResult"></span>
        <br><br>

        <label>Division:</label>
        <span id="divResult"></span>

    </div>

    <script src="cal.js"></script>

</body>
</html>
